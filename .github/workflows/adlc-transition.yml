name: ADLC Transition

on:
  workflow_dispatch:
    inputs:
      operation_payload:
        description: Exact canonical ADLC transition input
        required: true
        type: string
      operation_input_digest:
        description: SHA-256 of the exact transition input
        required: true
        type: string

run-name: ADLC transition ${{ inputs.operation_input_digest }} @ ${{ github.workflow_sha }}

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact transition validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate provider transition input
        run: ./node_modules/.bin/agentic-os-transition validate-event
