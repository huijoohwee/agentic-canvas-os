name: Enable authorized auto-delivery

on:
  pull_request_target:
    types: [labeled, unlabeled, edited, converted_to_draft, ready_for_review, synchronize, reopened]
  workflow_dispatch:
    inputs:
      operation:
        description: Exact trusted controller operation
        required: false
        default: auto-delivery
        type: string
      pull_request_number:
        description: Exact pull request number to reconcile
        required: true
        type: number
      branch:
        description: Exact protected refresh branch
        required: false
        type: string
      delivered_head_sha:
        description: Original delivery-authorized head
        required: false
        type: string
      observed_head_sha:
        description: Exact provider-observed head
        required: false
        type: string
      target_main_sha:
        description: Exact protected main ref selected for deterministic refresh
        required: false
        type: string
      canonical_base_sha:
        description: Delivery-authorized canonical base
        required: false
        type: string
      claim_id:
        description: Exact cloud collaboration claim ID
        required: false
        type: string
      claim_digest:
        description: Exact cloud claim fence digest
        required: false
        type: string
      ledger_revision:
        description: Projected cloud ledger revision
        required: false
        type: string
      review_request_id:
        description: Exact protected review identity
        required: false
        type: string
      pull_request_node_id:
        description: Exact pull request GraphQL node identity
        required: false
        type: string
      pull_request_title:
        description: Exact reviewed pull request title
        required: false
        type: string
      auto_merge_method:
        description: Exact original user auto-merge method
        required: false
        type: string
      auto_merge_enabled_by_database_id:
        description: Original auto-merge user's database ID
        required: false
        type: string
      auto_merge_enabled_by_node_id:
        description: Original auto-merge user's GraphQL node ID
        required: false
        type: string
      auto_merge_enabled_by_login:
        description: Original auto-merge user's login
        required: false
        type: string
      auto_merge_enabled_by_type:
        description: Original auto-merge actor type
        required: false
        type: string
      auto_merge_commit_title:
        description: Exact original auto-merge commit title
        required: false
        type: string
      auto_merge_commit_message:
        description: JSON-encoded original auto-merge commit message or null
        required: false
        type: string
      candidate_auto_merge_commit_title:
        description: Exact candidate re-authorization squash title
        required: false
        type: string
      candidate_auto_merge_commit_message:
        description: JSON-encoded deterministic non-null candidate squash body
        required: false
        type: string
      integration_receipt_digest:
        description: Exact delivery authorization receipt
        required: false
        type: string
      transition_counter:
        description: Exact cloud claim transition counter
        required: false
        type: string
      operation_id:
        description: Digest of the complete refresh projection
        required: false
        type: string

permissions: {}

jobs:
  auto-delivery:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        (inputs.operation == '' || inputs.operation == 'auto-delivery')
      ) ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (
            (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
            (
              github.event.label.name == 'agentic/auto-delivery' ||
              github.event.label.name == 'automerge/conflict'
            )
          ) ||
          (
            github.event.action != 'labeled' &&
            github.event.action != 'unlabeled' &&
            contains(github.event.pull_request.labels.*.name, 'agentic/auto-delivery')
          )
        )
      )
    permissions:
      contents: write
      pull-requests: write
    # Apply concurrency only after the event filter. Otherwise an unrelated
    # label event can replace a pending head-drift revocation before this job
    # is even admitted.
    concurrency:
      group: auto-delivery-${{ github.event.pull_request.number || inputs.pull_request_number }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enable protected auto-delivery for the exact reviewed head
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTIC_LEDGER_REPOSITORY: ${{ github.repository }}
          AUTO_DELIVERY_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: node scripts/sync-open-pr.mjs --auto-delivery

  protected-head-refresh:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'protected-head-refresh'
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: read
    concurrency:
      group: auto-delivery-${{ inputs.pull_request_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Run the protected head-refresh controller
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTIC_LEDGER_REPOSITORY: ${{ github.repository }}
          PROTECTED_HEAD_REFRESH_OPERATION: ${{ inputs.operation }}
          PROTECTED_HEAD_REFRESH_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          PROTECTED_HEAD_REFRESH_BRANCH: ${{ inputs.branch }}
          PROTECTED_HEAD_REFRESH_DELIVERED_HEAD_SHA: ${{ inputs.delivered_head_sha }}
          PROTECTED_HEAD_REFRESH_OBSERVED_HEAD_SHA: ${{ inputs.observed_head_sha }}
          PROTECTED_HEAD_REFRESH_TARGET_MAIN_SHA: ${{ inputs.target_main_sha }}
          PROTECTED_HEAD_REFRESH_CANONICAL_BASE_SHA: ${{ inputs.canonical_base_sha }}
          PROTECTED_HEAD_REFRESH_CLAIM_ID: ${{ inputs.claim_id }}
          PROTECTED_HEAD_REFRESH_CLAIM_DIGEST: ${{ inputs.claim_digest }}
          PROTECTED_HEAD_REFRESH_LEDGER_REVISION: ${{ inputs.ledger_revision }}
          PROTECTED_HEAD_REFRESH_REVIEW_REQUEST_ID: ${{ inputs.review_request_id }}
          PROTECTED_HEAD_REFRESH_PULL_REQUEST_NODE_ID: ${{ inputs.pull_request_node_id }}
          PROTECTED_HEAD_REFRESH_PULL_REQUEST_TITLE: ${{ inputs.pull_request_title }}
          PROTECTED_HEAD_REFRESH_AUTO_MERGE_METHOD: ${{ inputs.auto_merge_method }}
          PROTECTED_HEAD_REFRESH_AUTO_MERGE_ENABLED_BY_DATABASE_ID: ${{ inputs.auto_merge_enabled_by_database_id }}
          PROTECTED_HEAD_REFRESH_AUTO_MERGE_ENABLED_BY_NODE_ID: ${{ inputs.auto_merge_enabled_by_node_id }}
          PROTECTED_HEAD_REFRESH_AUTO_MERGE_ENABLED_BY_LOGIN: ${{ inputs.auto_merge_enabled_by_login }}
          PROTECTED_HEAD_REFRESH_AUTO_MERGE_ENABLED_BY_TYPE: ${{ inputs.auto_merge_enabled_by_type }}
          PROTECTED_HEAD_REFRESH_AUTO_MERGE_COMMIT_TITLE: ${{ inputs.auto_merge_commit_title }}
          PROTECTED_HEAD_REFRESH_AUTO_MERGE_COMMIT_MESSAGE: ${{ inputs.auto_merge_commit_message }}
          PROTECTED_HEAD_REFRESH_CANDIDATE_AUTO_MERGE_COMMIT_TITLE: ${{ inputs.candidate_auto_merge_commit_title }}
          PROTECTED_HEAD_REFRESH_CANDIDATE_AUTO_MERGE_COMMIT_MESSAGE: ${{ inputs.candidate_auto_merge_commit_message }}
          PROTECTED_HEAD_REFRESH_INTEGRATION_RECEIPT_DIGEST: ${{ inputs.integration_receipt_digest }}
          PROTECTED_HEAD_REFRESH_TRANSITION_COUNTER: ${{ inputs.transition_counter }}
          PROTECTED_HEAD_REFRESH_OPERATION_ID: ${{ inputs.operation_id }}
          PROTECTED_HEAD_REFRESH_CONTROLLER_REVISION: ${{ github.sha }}
        run: node scripts/sync-open-pr.mjs --protected-head-refresh
