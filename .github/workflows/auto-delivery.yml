name: Enable authorized auto-delivery

on:
  pull_request_target:
    types: [labeled, ready_for_review, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Enable protected auto-delivery for the exact reviewed head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-open-pr.mjs --auto-delivery
