name: CI
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || format('CI {0} {1}', github.event_name, github.ref_name) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorization:
    name: ci-authorization
    runs-on: 'ubuntu-slim'
    timeout-minutes: 5
    steps:
      - name: Accept the provider-selected candidate
        run: test -n "${{ github.sha }}"

  test:
    name: test
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ci -- --only=test-${{ matrix.shard }}

  test_aggregate:
    name: test
    needs: [authorization, test]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require authorization and every test shard
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
          TEST_SHARDS_RESULT: ${{ needs.test.result }}
        run: |
          [ "$AUTHORIZATION_RESULT" = "success" ] || exit 1
          [ "$TEST_SHARDS_RESULT" = "success" ] || exit 1

  build:
    name: build
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Read exact Graph source revision
        id: graph-source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('config/observability-workspace.json', 'utf8'));
          const graph = manifest.repositories?.find(repository => repository.id === 'agentic-graph');
          if (!/^[a-f0-9]{40}$/.test(graph?.buildRevision ?? '')) throw new Error('Graph buildRevision must pin an exact commit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${graph.buildRevision}\n`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-graph
          ref: ${{ steps.graph-source.outputs.revision }}
          path: agentic-graph
          fetch-depth: 1
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install only Graph dashboard workspace dependencies
        working-directory: agentic-graph
        run: npm ci --workspace=@agentic-graph/canvas --workspace=grph-shared --workspace=gympgrph --workspace=@agentic-graph/mcp --include-workspace-root=false --ignore-scripts --no-audit --no-fund
      - name: Prepare Graph linked packages
        working-directory: agentic-graph
        run: npm run prepare:linked-packages --workspace=@agentic-graph/canvas
      - name: Prepare dashboard source templates and settings
        working-directory: agentic-graph
        run: |
          npm run prepare:html-viewer-runtime --workspace=@agentic-graph/canvas
          npm run build:settings --workspace=@agentic-graph/canvas
      - name: Build the exact native Graph dashboard
        env:
          AGENTIC_WORKSPACE_ROOT: ${{ github.workspace }}
        run: npm run check:ci -- --only=build

  docs-contract:
    name: docs-contract
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ci -- --only=docs
      - name: Checkout reviewed Markdown sync verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-os
          ref: b8becb04f93813bd209f8cc7f711558062a98091
          path: .doc-sync-os
          persist-credentials: false
      - name: Checkout reviewed documentation template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/huijoohwee.github.io
          ref: a9ab28adedf0d96b74670f459315560fa854b3b5
          path: .doc-sync-source
          fetch-depth: 0
          persist-credentials: false
      - name: Check enrolled Canvas document
        run: >-
          node .doc-sync-os/scripts/doc-sync.mjs
          --mode=check --repo=. --source-repo=.doc-sync-source
          --document=docs/document-maintenance.md
          --to=a9ab28adedf0d96b74670f459315560fa854b3b5

  collaboration-integration:
    name: collaboration-integration
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ci -- --only=collaboration

  budgets:
    name: budgets
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify bounded repository contracts
        run: npm run check:ci -- --only=budgets
