name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run build

  docs-contract:
    name: docs-contract
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run docs:check

  collaboration-integration:
    name: collaboration-integration
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run collab:test

  evaluate:
    name: policy-runtime-readiness
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve the pinned guideline source revision
        id: guideline-source
        run: >-
          node --input-type=module -e
          'import { appendFileSync } from "node:fs";
          import { LIFECYCLE_POLICY_SOURCE } from "./scripts/lifecycle-conformance-policy.mjs";
          const revision = String(LIFECYCLE_POLICY_SOURCE.revision ?? "");
          if (!/^[0-9a-f]{40}$/u.test(revision)) throw new Error("guideline source revision must be a full commit SHA");
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${revision}\n`);'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/huijoohwee.github.io
          ref: ${{ steps.guideline-source.outputs.revision }}
          path: .agentic-sdlc-source/huijoohwee.github.io
          persist-credentials: false
          fetch-depth: 0
      - name: Verify repository policy-runtime readiness
        env:
          GITHUB_ROOT: ${{ github.workspace }}/.agentic-sdlc-source
        run: |
          npm run lifecycle:conformance:check
          npm run agentic-sdlc:source:check

  conformance:
    name: agentic-sdlc-policy-runtime
    needs: evaluate
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require policy-runtime readiness
        env:
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
        run: |
          if [ "$EVALUATE_RESULT" != "success" ]; then
            echo "policy-runtime readiness did not succeed: $EVALUATE_RESULT" >&2
            exit 1
          fi
