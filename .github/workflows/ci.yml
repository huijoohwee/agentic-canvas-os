name: CI
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || format('CI {0} {1}', github.event_name, github.ref_name) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorization:
    name: ci-authorization
    runs-on: 'ubuntu-slim'
    timeout-minutes: 5
    steps:
      - name: Accept the provider-selected candidate
        run: test -n "${{ github.sha }}"

  test:
    name: test
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test --test-shard=${{ matrix.shard }}/4 __tests__/*.test.mjs

  test_aggregate:
    name: test
    needs: [authorization, test]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require authorization and every test shard
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
          TEST_SHARDS_RESULT: ${{ needs.test.result }}
        run: |
          [ "$AUTHORIZATION_RESULT" = "success" ] || exit 1
          [ "$TEST_SHARDS_RESULT" = "success" ] || exit 1

  build:
    name: build
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run build

  docs-contract:
    name: docs-contract
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run docs:check

  collaboration-integration:
    name: collaboration-integration
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run collab:test

  budgets:
    name: budgets
    needs: authorization
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Require exact CI authorization
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
        run: test "$AUTHORIZATION_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify bounded repository contracts
        run: |
          npm --prefix node_modules/agentic-os run evals
          npm run authored-line-budget:check
          node --test __tests__/adlc-compatibility.test.mjs __tests__/agentic-os-profile.test.mjs
          npm run dictionary-catalog:check
