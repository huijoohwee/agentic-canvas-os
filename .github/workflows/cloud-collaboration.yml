name: Cloud collaboration

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Collaboration action
        required: true
        default: status
        type: choice
        options:
          - status
          - verify
          - claim
          - heartbeat
          - review-ready
          - handoff
          - release
      target_repository:
        description: Target owner/repository (required except for all-claim status)
        required: false
        type: string
      scope:
        description: Semantic scope
        required: false
        type: string
      work_item:
        description: Stable work item (defaults to scope, branch, PR, or run)
        required: false
        type: string
      branch:
        description: Exact agent branch
        required: false
        type: string
      base_sha:
        description: Expected canonical base SHA
        required: false
        type: string
      head_sha:
        description: Expected branch head SHA
        required: false
        type: string
      pull_request_number:
        description: Exact pull request number
        required: false
        type: string
      write_scopes_json:
        description: JSON array of repository-relative write scopes
        required: false
        default: "[]"
        type: string
      ttl_seconds:
        description: Claim lifetime in seconds
        required: false
        default: 1800
        type: number
      handoff_mode:
        description: Handoff recipient mode (actor or open)
        required: false
        type: string
      claim_id:
        description: Current SHA-256 claim identity
        required: false
        type: string
      expected_claim_digest:
        description: Expected current claim digest/fence revision
        required: false
        type: string
      expected_ledger_revision:
        description: Expected ancestor ledger commit SHA
        required: false
        type: string
      expected_transition_counter:
        description: Expected current transition counter
        required: false
        type: string
      lease_epoch:
        description: Monotonic lease epoch for a new claim
        required: false
        type: string
      predecessor_claim_id:
        description: Exact predecessor claim for takeover or handoff
        required: false
        type: string
      evidence_digest:
        description: SHA-256 lifecycle evidence digest
        required: false
        type: string
      focused_evidence_digest:
        description: SHA-256 focused review evidence digest
        required: false
        type: string
      integration_receipt_digest:
        description: SHA-256 integration receipt digest
        required: false
        type: string
      release_reason:
        description: Release reason (integrated, abandoned, or handoff)
        required: false
        type: string
      next_actor_id:
        description: Exact next actor ID for actor handoff
        required: false
        type: string
      required_state:
        description: Required state for manual verification
        required: false
        type: string

permissions: {}

concurrency:
  group: agentic-cloud-collaboration-ledger
  queue: max

jobs:
  pull-request-controller:
    name: Cloud collaboration check controller
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Publish exact-head cloud collaboration verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloud-collaboration-check-run.mjs

  main-audit:
    name: cloud-collaboration
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify the trusted GitHub event against cloud authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloud-collaboration.mjs verify-event --event-path "$GITHUB_EVENT_PATH" --json

  read:
    name: Read cloud collaboration state
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.action == 'status' || inputs.action == 'verify')
      }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Read or verify the cloud collaboration ledger
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTIC_CLOUD_ACTION: ${{ inputs.action }}
          AGENTIC_TARGET_REPOSITORY: ${{ inputs.target_repository }}
          AGENTIC_DEVICE_ID: github-actions
          AGENTIC_SESSION_ID: workflow-run:${{ github.run_id }}
          AGENTIC_CLOUD_WORK_ITEM: ${{ inputs.work_item || inputs.scope || inputs.branch || inputs.pull_request_number || github.run_id }}
          AGENTIC_CLOUD_SCOPE: ${{ inputs.scope }}
          AGENTIC_CLOUD_BRANCH: ${{ inputs.branch }}
          AGENTIC_CLOUD_BASE_SHA: ${{ inputs.base_sha }}
          AGENTIC_CLOUD_HEAD_SHA: ${{ inputs.head_sha }}
          AGENTIC_CLOUD_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          AGENTIC_CLOUD_WRITE_SCOPES_JSON: ${{ inputs.write_scopes_json }}
          AGENTIC_CLOUD_TTL_SECONDS: ${{ inputs.ttl_seconds }}
          AGENTIC_CLOUD_HANDOFF_MODE: ${{ inputs.handoff_mode }}
          AGENTIC_CLOUD_CLAIM_ID: ${{ inputs.claim_id }}
          AGENTIC_CLOUD_EXPECTED_CLAIM_DIGEST: ${{ inputs.expected_claim_digest }}
          AGENTIC_CLOUD_EXPECTED_LEDGER_REVISION: ${{ inputs.expected_ledger_revision }}
          AGENTIC_CLOUD_EXPECTED_TRANSITION_COUNTER: ${{ inputs.expected_transition_counter }}
          AGENTIC_CLOUD_LEASE_EPOCH: ${{ inputs.lease_epoch }}
          AGENTIC_CLOUD_PREDECESSOR_CLAIM_ID: ${{ inputs.predecessor_claim_id }}
          AGENTIC_CLOUD_EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
          AGENTIC_CLOUD_FOCUSED_EVIDENCE_DIGEST: ${{ inputs.focused_evidence_digest }}
          AGENTIC_CLOUD_INTEGRATION_RECEIPT_DIGEST: ${{ inputs.integration_receipt_digest }}
          AGENTIC_CLOUD_RELEASE_REASON: ${{ inputs.release_reason }}
          AGENTIC_CLOUD_NEXT_ACTOR_ID: ${{ inputs.next_actor_id }}
          AGENTIC_CLOUD_REQUIRED_STATE: ${{ inputs.required_state }}
        run: node scripts/cloud-collaboration.mjs dispatch --json

  mutate:
    name: Mutate cloud collaboration state
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.action == 'claim' ||
          inputs.action == 'heartbeat' ||
          inputs.action == 'review-ready' ||
          inputs.action == 'handoff' ||
          inputs.action == 'release'
        )
      }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Apply one fenced cloud collaboration transition
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTIC_CLOUD_ACTION: ${{ inputs.action }}
          AGENTIC_TARGET_REPOSITORY: ${{ inputs.target_repository }}
          AGENTIC_DEVICE_ID: github-actions
          AGENTIC_SESSION_ID: workflow-run:${{ github.run_id }}
          AGENTIC_CLOUD_WORK_ITEM: ${{ inputs.work_item || inputs.scope || inputs.branch || inputs.pull_request_number || github.run_id }}
          AGENTIC_CLOUD_SCOPE: ${{ inputs.scope }}
          AGENTIC_CLOUD_BRANCH: ${{ inputs.branch }}
          AGENTIC_CLOUD_BASE_SHA: ${{ inputs.base_sha }}
          AGENTIC_CLOUD_HEAD_SHA: ${{ inputs.head_sha }}
          AGENTIC_CLOUD_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          AGENTIC_CLOUD_WRITE_SCOPES_JSON: ${{ inputs.write_scopes_json }}
          AGENTIC_CLOUD_TTL_SECONDS: ${{ inputs.ttl_seconds }}
          AGENTIC_CLOUD_HANDOFF_MODE: ${{ inputs.handoff_mode }}
          AGENTIC_CLOUD_CLAIM_ID: ${{ inputs.claim_id }}
          AGENTIC_CLOUD_EXPECTED_CLAIM_DIGEST: ${{ inputs.expected_claim_digest }}
          AGENTIC_CLOUD_EXPECTED_LEDGER_REVISION: ${{ inputs.expected_ledger_revision }}
          AGENTIC_CLOUD_EXPECTED_TRANSITION_COUNTER: ${{ inputs.expected_transition_counter }}
          AGENTIC_CLOUD_LEASE_EPOCH: ${{ inputs.lease_epoch }}
          AGENTIC_CLOUD_PREDECESSOR_CLAIM_ID: ${{ inputs.predecessor_claim_id }}
          AGENTIC_CLOUD_EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
          AGENTIC_CLOUD_FOCUSED_EVIDENCE_DIGEST: ${{ inputs.focused_evidence_digest }}
          AGENTIC_CLOUD_INTEGRATION_RECEIPT_DIGEST: ${{ inputs.integration_receipt_digest }}
          AGENTIC_CLOUD_RELEASE_REASON: ${{ inputs.release_reason }}
          AGENTIC_CLOUD_NEXT_ACTOR_ID: ${{ inputs.next_actor_id }}
          AGENTIC_CLOUD_REQUIRED_STATE: ${{ inputs.required_state }}
        run: node scripts/cloud-collaboration.mjs dispatch --json
