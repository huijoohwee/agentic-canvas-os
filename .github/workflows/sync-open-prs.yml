name: Sync open auto-merge PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-open-automerge-prs
  cancel-in-progress: false

jobs:
  sync-oldest:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Update the oldest eligible PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-open-pr.mjs
